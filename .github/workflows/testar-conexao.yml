name: Testar conexão com a Turbo Cloud

# Entra por FTPS na hospedagem e confere o que a publicação precisa (login,
# certificado, raiz do site, o que já existe nela, permissão de gravar). Não
# publica nada. Rode em Actions > "Testar conexão com a Turbo Cloud" > Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Diagnosticar a rede (sem entrar no servidor)
        env:
          SERVIDOR: ${{ secrets.DESPERTAR_FTP_HOST || secrets.DESPERTAR_SSH_HOST }}
        run: bash hospedagem/diagnosticar-rede.sh

      - name: Instalar o lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Conferir o servidor (só leitura e um arquivo de teste apagado na hora)
        env:
          FTP_HOST: ${{ secrets.DESPERTAR_FTP_HOST || secrets.DESPERTAR_SSH_HOST }}
          FTP_USER: ${{ secrets.DESPERTAR_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.DESPERTAR_FTP_PASSWORD }}
          FTP_PORTA: ${{ vars.DESPERTAR_FTP_PORT || '21' }}
        run: sh hospedagem/conferir-servidor.sh
