name: Publicar na Turbo Cloud

# Gera a página (npm run build -> out/) e envia por FTPS para a hospedagem, com
# hospedagem/publicar.sh, que confere pelo tamanho cada arquivo enviado. Por
# enquanto só roda quando alguém dispara: Actions > "Publicar na Turbo Cloud" > Run workflow.
on:
  workflow_dispatch:

# Uma publicação de cada vez.
concurrency:
  group: publicar-turbo-cloud
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Instalar o lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Enviar para a hospedagem
        env:
          FTP_HOST: ${{ secrets.DESPERTAR_FTP_HOST || secrets.DESPERTAR_SSH_HOST }}
          FTP_USER: ${{ secrets.DESPERTAR_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.DESPERTAR_FTP_PASSWORD }}
          FTP_PORTA: ${{ vars.DESPERTAR_FTP_PORT || '21' }}
        run: sh hospedagem/publicar.sh
